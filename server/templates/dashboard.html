{% extends "base.html" %}
{% block title %}대시보드 — CPET Platform{% endblock %}

{% block content %}
<div>
  <style>
    @keyframes cpetScan {
      0% { transform: translateX(-140%); opacity: 0; }
      20% { opacity: .24; }
      100% { transform: translateX(260%); opacity: 0; }
    }

    @keyframes cpetGlow {
      0%, 100% { box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12); }
      50% { box-shadow: 0 16px 40px rgba(14, 165, 233, 0.22); }
    }

    .job-processing-surface {
      position: relative;
      overflow: hidden;
      border-radius: 9999px;
      background:
        linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.94)),
        linear-gradient(90deg, rgba(34, 211, 238, 0.12), rgba(96, 165, 250, 0.18));
      animation: cpetGlow 2.2s ease-in-out infinite;
    }

    .job-processing-surface::after {
      content: "";
      position: absolute;
      inset: -35% auto -35% -30%;
      width: 36%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.26),
        transparent
      );
      transform: skewX(-18deg);
      animation: cpetScan 2.5s linear infinite;
      pointer-events: none;
    }

    .job-processing-track {
      background-image:
        linear-gradient(90deg, rgba(34, 211, 238, 0.26), rgba(251, 191, 36, 0.34), rgba(14, 165, 233, 0.26)),
        linear-gradient(90deg, rgba(255, 255, 255, 0.10) 1px, transparent 1px);
      background-size: 200% 100%, 12px 100%;
      animation: cpetScan 3.3s linear infinite;
    }
  </style>
  <h1 class="text-2xl font-bold mb-6">대시보드</h1>

  {% if current_user %}
  <div class="mb-4 flex gap-2" id="filter-tabs">
    <button
      class="filter-tab px-4 py-2 rounded-full text-sm font-medium transition
        bg-gray-900 text-white"
      hx-get="/api/jobs/partial"
      hx-target="#job-list-body"
      hx-swap="innerHTML"
      onclick="activateTab(this)"
      data-filter="all"
    >All</button>
    <button
      class="filter-tab px-4 py-2 rounded-full text-sm font-medium transition
        text-gray-600 bg-gray-100 hover:bg-gray-200"
      hx-get="/api/jobs/partial?filter=mine"
      hx-target="#job-list-body"
      hx-swap="innerHTML"
      onclick="activateTab(this)"
      data-filter="mine"
    >My Reports</button>
  </div>
  <script>
    function activateTab(el) {
      document.querySelectorAll('#filter-tabs .filter-tab').forEach(function(btn) {
        btn.className = 'filter-tab px-4 py-2 rounded-full text-sm font-medium transition text-gray-600 bg-gray-100 hover:bg-gray-200';
      });
      el.className = 'filter-tab px-4 py-2 rounded-full text-sm font-medium transition bg-gray-900 text-white';

      // Update the polling URL on the tbody to match the active filter
      var tbody = document.getElementById('job-list-body');
      var url = el.getAttribute('hx-get');
      tbody.setAttribute('hx-get', url);
      htmx.process(tbody);  // re-register the updated hx-get
    }
  </script>
  {% endif %}

  <div class="bg-white rounded-lg shadow">
    <div
      id="job-list-body"
      hx-get="/api/jobs/partial"
      hx-trigger="load, every 3s"
      hx-swap="innerHTML"
      class="divide-y divide-gray-100"
    >
      <!-- Loading skeleton -->
      <div class="px-4 py-3 animate-pulse">
        <div class="flex items-center gap-3"><div class="h-4 bg-gray-200 rounded w-24"></div><div class="h-4 bg-gray-200 rounded w-20"></div><div class="ml-auto h-5 bg-gray-200 rounded w-12"></div></div>
        <div class="flex items-center gap-2 mt-2"><div class="h-3 bg-gray-100 rounded w-10"></div><div class="h-3 bg-gray-100 rounded w-32"></div></div>
      </div>
      <div class="px-4 py-3 animate-pulse">
        <div class="flex items-center gap-3"><div class="h-4 bg-gray-200 rounded w-20"></div><div class="h-4 bg-gray-200 rounded w-20"></div><div class="ml-auto h-5 bg-gray-200 rounded w-12"></div></div>
        <div class="flex items-center gap-2 mt-2"><div class="h-3 bg-gray-100 rounded w-10"></div><div class="h-3 bg-gray-100 rounded w-28"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- 피험자명 수정 모달 -->
<div id="rename-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50" onclick="if(event.target===this)closeRenameModal()">
  <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md mx-4" onclick="event.stopPropagation()">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">피험자명 수정</h3>
    <input
      id="rename-input"
      type="text"
      class="w-full rounded-lg border border-gray-300 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400"
      placeholder="피험자 이름"
    />
    <input id="rename-submission-id" type="hidden" />
    <input id="rename-report-slug" type="hidden" />
    <div class="flex justify-end gap-3 mt-4">
      <button
        onclick="closeRenameModal()"
        class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800"
      >취소</button>
      <button
        onclick="submitRename()"
        class="px-4 py-2 text-sm font-medium bg-gray-900 text-white rounded-lg hover:bg-gray-800"
      >저장</button>
    </div>
  </div>
</div>

<script>
function openRenameModal(submissionId, reportSlug, currentName) {
  document.getElementById('rename-submission-id').value = submissionId;
  document.getElementById('rename-report-slug').value = reportSlug;
  document.getElementById('rename-input').value = currentName;
  const modal = document.getElementById('rename-modal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  document.getElementById('rename-input').focus();
}

function closeRenameModal() {
  const modal = document.getElementById('rename-modal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

function submitRename() {
  const subId = document.getElementById('rename-submission-id').value;
  const slug = document.getElementById('rename-report-slug').value;
  const name = document.getElementById('rename-input').value.trim();
  if (!name) return;
  const body = `subject_name=${encodeURIComponent(name)}&submission_id=${encodeURIComponent(subId)}&report_slug=${encodeURIComponent(slug)}`;
  fetch('/api/manage/rename-subject', {
    method: 'PATCH',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: body
  }).then(r => {
    if (r.ok) {
      closeRenameModal();
      htmx.trigger(document.getElementById('job-list-body'), 'load');
    }
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !document.getElementById('rename-modal').classList.contains('hidden')) {
    submitRename();
  }
  if (e.key === 'Escape') closeRenameModal();
});
</script>
{% endblock %}
