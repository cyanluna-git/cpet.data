<!-- Body composition fields partial — swapped in by HTMX after PATCH -->
<div id="body-comp-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-4">

  <!-- 체중 -->
  <div class="bg-gray-50 rounded-lg p-4">
    <label class="block text-xs font-medium text-gray-500 mb-1">체중 (kg)</label>
    <input
      type="number" step="0.1" name="weight_kg"
      value="{{ profile.weight_kg or '' }}"
      placeholder="—"
      class="w-full bg-transparent text-lg font-semibold text-gray-900
             border-b border-transparent focus:border-gray-400
             focus:outline-none transition-colors"
      hx-patch="/api/profile"
      hx-trigger="change"
      hx-target="#body-comp-fields"
      hx-swap="outerHTML"
      hx-include="[name='weight_kg']"
      hx-indicator="#save-indicator"
    />
  </div>

  <!-- 신장 -->
  <div class="bg-gray-50 rounded-lg p-4">
    <label class="block text-xs font-medium text-gray-500 mb-1">신장 (cm)</label>
    <input
      type="number" step="0.1" name="height_cm"
      value="{{ profile.height_cm or '' }}"
      placeholder="—"
      class="w-full bg-transparent text-lg font-semibold text-gray-900
             border-b border-transparent focus:border-gray-400
             focus:outline-none transition-colors"
      hx-patch="/api/profile"
      hx-trigger="change"
      hx-target="#body-comp-fields"
      hx-swap="outerHTML"
      hx-include="[name='height_cm']"
      hx-indicator="#save-indicator"
    />
  </div>

  <!-- 체지방률 -->
  <div class="bg-gray-50 rounded-lg p-4">
    <label class="block text-xs font-medium text-gray-500 mb-1">체지방률 (%)</label>
    <input
      type="number" step="0.1" name="body_fat_pct"
      value="{{ profile.body_fat_pct or '' }}"
      placeholder="—"
      class="w-full bg-transparent text-lg font-semibold text-gray-900
             border-b border-transparent focus:border-gray-400
             focus:outline-none transition-colors"
      hx-patch="/api/profile"
      hx-trigger="change"
      hx-target="#body-comp-fields"
      hx-swap="outerHTML"
      hx-include="[name='body_fat_pct']"
      hx-indicator="#save-indicator"
    />
  </div>

  <!-- 골격근량 -->
  <div class="bg-gray-50 rounded-lg p-4">
    <label class="block text-xs font-medium text-gray-500 mb-1">골격근량 (kg)</label>
    <input
      type="number" step="0.1" name="skeletal_muscle_mass"
      value="{{ profile.skeletal_muscle_mass or '' }}"
      placeholder="—"
      class="w-full bg-transparent text-lg font-semibold text-gray-900
             border-b border-transparent focus:border-gray-400
             focus:outline-none transition-colors"
      hx-patch="/api/profile"
      hx-trigger="change"
      hx-target="#body-comp-fields"
      hx-swap="outerHTML"
      hx-include="[name='skeletal_muscle_mass']"
      hx-indicator="#save-indicator"
    />
  </div>

  <!-- BMI -->
  <div class="bg-gray-50 rounded-lg p-4">
    <label class="block text-xs font-medium text-gray-500 mb-1">BMI</label>
    <input
      type="number" step="0.1" name="bmi"
      value="{{ profile.bmi or '' }}"
      placeholder="—"
      class="w-full bg-transparent text-lg font-semibold text-gray-900
             border-b border-transparent focus:border-gray-400
             focus:outline-none transition-colors"
      hx-patch="/api/profile"
      hx-trigger="change"
      hx-target="#body-comp-fields"
      hx-swap="outerHTML"
      hx-include="[name='bmi']"
      hx-indicator="#save-indicator"
    />
  </div>

  <!-- 측정일 -->
  <div class="bg-gray-50 rounded-lg p-4">
    <label class="block text-xs font-medium text-gray-500 mb-1">측정일</label>
    <input
      type="date" name="measured_at"
      value="{{ profile.measured_at or '' }}"
      class="w-full bg-transparent text-lg font-semibold text-gray-900
             border-b border-transparent focus:border-gray-400
             focus:outline-none transition-colors"
      hx-patch="/api/profile"
      hx-trigger="change"
      hx-target="#body-comp-fields"
      hx-swap="outerHTML"
      hx-include="[name='measured_at']"
      hx-indicator="#save-indicator"
    />
  </div>

</div>
