{% extends "base.html" %}
{% block title %}{{ note.title }} — Notes{% endblock %}

{% block content %}
<section class="space-y-6">
  <div class="rounded-[28px] border border-gray-200 bg-white/90 p-8 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <div class="inline-flex rounded-full bg-gray-100 px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-gray-500">
          {{ note.category }}
        </div>
        <h1 class="mt-4 text-3xl font-semibold tracking-tight text-gray-900">{{ note.title }}</h1>
        <p class="mt-3 max-w-3xl text-sm leading-7 text-gray-600">{{ note.summary }}</p>
      </div>
      <div class="text-right text-xs text-gray-400">
        <div>{{ note.filename }}</div>
        <div class="mt-1">{{ note.updated_at }}</div>
      </div>
    </div>
    <div class="mt-6 flex flex-wrap gap-3">
      <a href="/notes" class="inline-flex items-center rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
        목록으로
      </a>
      <a href="/notes/{{ note.slug }}/content" target="_blank" rel="noopener" class="inline-flex items-center rounded-lg bg-gray-900 px-4 py-2 text-sm font-medium text-white hover:bg-gray-800">
        새 탭에서 열기
      </a>
    </div>
  </div>

  <div class="overflow-hidden rounded-[28px] border border-gray-200 bg-white shadow-sm">
    <iframe
      title="{{ note.title }}"
      src="/notes/{{ note.slug }}/content"
      class="h-[calc(100vh-220px)] min-h-[920px] w-full border-0"
      loading="eager"
    ></iframe>
  </div>
</section>
{% endblock %}
