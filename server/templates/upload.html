{% extends "base.html" %}
{% block title %}업로드 — CPET Platform{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <h1 class="text-2xl font-bold mb-6">파일 업로드</h1>

  <form
    id="upload-form"
    hx-post="/api/submit"
    hx-encoding="multipart/form-data"
    hx-indicator="#submit-spinner"
    hx-on::after-request="if(event.detail.successful) window.location.href='/dashboard'"
    class="bg-white rounded-lg shadow p-6 space-y-5"
  >
    <!-- Drag-and-drop zone -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        COSMED 파일 (.xlsx 필수)
      </label>
      <div
        id="dropzone"
        class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center
               cursor-pointer hover:border-gray-400 transition-colors"
      >
        <p class="text-gray-500 text-sm">
          파일을 드래그하거나 클릭하여 선택하세요
        </p>
        <p class="text-gray-400 text-xs mt-1">
          .xlsx, .fit, .zwo, .csv, .md (최대 50 MB)
        </p>
        <input
          type="file"
          name="files"
          id="file-input"
          multiple
          accept=".xlsx,.fit,.zwo,.csv,.md"
          class="hidden"
        />
      </div>
      <!-- File list preview -->
      <ul id="file-list" class="mt-3 space-y-1 text-sm text-gray-600"></ul>
    </div>

    <!-- Description -->
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
        설명 <span class="text-red-500">*</span>
      </label>
      <textarea
        name="description"
        id="description"
        required
        rows="3"
        placeholder="분석 요청 내용을 입력하세요"
        class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm
               focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
      ></textarea>
    </div>

    <!-- Subject name (optional) -->
    <div>
      <label for="subject_name" class="block text-sm font-medium text-gray-700 mb-1">
        피험자 이름 <span class="text-gray-400 text-xs">(선택)</span>
      </label>
      <input
        type="text"
        name="subject_name"
        id="subject_name"
        placeholder="예: 홍길동"
        class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm
               focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
      />
    </div>

    <!-- Test date (optional) -->
    <div>
      <label for="test_date" class="block text-sm font-medium text-gray-700 mb-1">
        검사 날짜 <span class="text-gray-400 text-xs">(선택)</span>
      </label>
      <input
        type="date"
        name="test_date"
        id="test_date"
        class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm
               focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
      />
    </div>

    <!-- Submit button -->
    <button
      type="submit"
      class="w-full bg-gray-900 text-white py-2.5 rounded-md text-sm font-medium
             hover:bg-gray-800 transition-colors flex items-center justify-center gap-2"
    >
      <span>제출하기</span>
      <!-- Spinner indicator (hidden until request in flight) -->
      <svg
        id="submit-spinner"
        class="htmx-indicator animate-spin h-4 w-4 text-white"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle class="opacity-25" cx="12" cy="12" r="10"
                stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
    </button>
  </form>
</div>

<script>
// Drag-and-drop + click-to-select file handling
(function () {
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file-input");
  const fileList = document.getElementById("file-list");

  // Click dropzone to open file picker
  dropzone.addEventListener("click", function () {
    fileInput.click();
  });

  // Prevent default drag behaviors on the page
  ["dragenter", "dragover", "dragleave", "drop"].forEach(function (evt) {
    dropzone.addEventListener(evt, function (e) {
      e.preventDefault();
      e.stopPropagation();
    });
  });

  // Visual feedback on drag
  ["dragenter", "dragover"].forEach(function (evt) {
    dropzone.addEventListener(evt, function () {
      dropzone.classList.add("border-gray-500", "bg-gray-50");
    });
  });
  ["dragleave", "drop"].forEach(function (evt) {
    dropzone.addEventListener(evt, function () {
      dropzone.classList.remove("border-gray-500", "bg-gray-50");
    });
  });

  // Handle dropped files
  dropzone.addEventListener("drop", function (e) {
    fileInput.files = e.dataTransfer.files;
    renderFileList(fileInput.files);
  });

  // Handle file picker selection
  fileInput.addEventListener("change", function () {
    renderFileList(fileInput.files);
  });

  function renderFileList(files) {
    fileList.innerHTML = "";
    for (var i = 0; i < files.length; i++) {
      var li = document.createElement("li");
      var sizeKB = (files[i].size / 1024).toFixed(1);
      li.textContent = files[i].name + " (" + sizeKB + " KB)";
      li.className = "text-gray-600";
      fileList.appendChild(li);
    }
  }
})();
</script>
{% endblock %}
